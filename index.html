<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מ-3 יחידות ל-4 יחידות | אפליקציית תרגול</title>
<style>
  :root{
    --bg:#f5f7fb;
    --card-bg:#ffffff;
    --text:#1e2433;
    --text-dim:#5b6472;
    --primary:#3457d5;
    --primary-dark:#2540a8;
    --green:#1f9d63;
    --green-bg:#e6f6ee;
    --amber:#b8790a;
    --amber-bg:#fdf3e0;
    --red:#c0392b;
    --red-bg:#fbeae8;
    --gray:#8a93a3;
    --gray-bg:#eef0f4;
    --border:#e1e5ee;
    --shadow: 0 2px 10px rgba(30,36,51,0.06), 0 1px 2px rgba(30,36,51,0.08);
    --radius:14px;
    --accent-indigo:#4f46e5;
    --accent-teal:#0d9488;
    --accent-magenta:#be185d;
    --accent-cyan:#0891b2;
    --accent-slate:#475569;
    --accent-lime:#65a30d;
    --accent-purple:#9333ea;
    --accent-sky:#0284c7;
    --accent-orange:#c2410c;
    --accent-rose:#e11d48;
    --accent-brown:#78350f;
  }
  @keyframes fadeSlideIn{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes popIn{
    0%{transform:scale(0.94); opacity:0;}
    60%{transform:scale(1.015);}
    100%{transform:scale(1); opacity:1;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family: "Segoe UI", Arial, Tahoma, sans-serif;
    line-height:1.55;
    min-height:100vh;
  }
  #app{max-width:960px;margin:0 auto;padding:20px 16px 60px;}
  h1,h2,h3{line-height:1.3;margin:0 0 8px;}
  h1{font-size:1.5rem;}
  h2{font-size:1.25rem;}
  h3{font-size:1.05rem;}
  p{margin:0 0 12px;}
  a{color:var(--primary);}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:10px;
    padding:10px 18px;
    font-size:0.95rem;
    font-weight:600;
    transition:transform .05s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.97);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  button svg{width:16px;height:16px;vertical-align:-3px;margin-inline-end:5px;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-secondary{background:var(--gray-bg);color:var(--text);}
  .btn-secondary:hover{background:#e2e6ee;}
  .btn-ghost{background:transparent;color:var(--primary);padding:8px 10px;}
  .btn-danger{background:var(--red-bg);color:var(--red);}
  .btn-block{width:100%;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row.between{justify-content:space-between;align-items:center;}

  header.top{
    display:flex;justify-content:space-between;align-items:flex-start;
    margin-bottom:20px;gap:12px;flex-wrap:wrap;
  }
  header.top .title-block{flex:1;min-width:220px;}
  .subtitle{color:var(--text-dim);font-size:0.92rem;}

  .card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
    margin-bottom:16px;
  }

  .hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
  @media (max-width:560px){.hero-actions{grid-template-columns:1fr;}}
  .hero-btn{
    background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px; text-align:right; cursor:pointer;
    display:flex; flex-direction:column; align-items:flex-start; gap:10px;
    transition:border-color .15s ease, transform .1s ease;
  }
  .hero-btn:hover{border-color:var(--icon-color, var(--primary)); transform:translateY(-1px);}
  .icon-chip{
    width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:var(--icon-bg, var(--gray-bg)); color:var(--icon-color, var(--primary)); flex-shrink:0;
  }
  .icon-chip svg{width:22px;height:22px;}
  .hero-btn h3{color:var(--text);margin:0 0 4px;}
  .hero-btn p{color:var(--text-dim);font-size:0.88rem;margin:0;}

  .topics-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:640px){.topics-grid{grid-template-columns:1fr;}}

  .topic-card{
    background:var(--card-bg);border:1px solid var(--border);border-inline-start:4px solid var(--icon-color, var(--border));
    border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px; cursor:pointer; position:relative;
    transition:transform .12s ease, box-shadow .12s ease;
    display:flex; gap:12px; align-items:flex-start;
  }
  .topic-card:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(30,36,51,0.1);}
  .topic-card.locked{opacity:.55;cursor:default;}
  .topic-card.locked:hover{transform:none; box-shadow:var(--shadow);}
  .topic-card .icon-chip{width:38px;height:38px;border-radius:10px;}
  .topic-card .icon-chip svg{width:19px;height:19px;}
  .topic-card-body{flex:1;min-width:0;}
  .topic-week{font-size:0.72rem;color:var(--icon-color, var(--primary));font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin-bottom:4px;}
  .status-badge{
    display:inline-block;font-size:0.74rem;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:8px;
  }
  .status-not-started{background:var(--gray-bg);color:var(--gray);}
  .status-in-progress{background:var(--amber-bg);color:var(--amber);}
  .status-mastered{background:var(--green-bg);color:var(--green);}
  .status-soon{background:var(--gray-bg);color:var(--gray);}

  .score-pill{font-size:0.8rem;color:var(--text-dim);margin-top:6px;}

  .breadcrumb{font-size:0.85rem;color:var(--text-dim);margin-bottom:10px;cursor:pointer;}
  .breadcrumb span{color:var(--primary);cursor:pointer;}

  .explain-block{background:var(--gray-bg);border-radius:10px;padding:14px 16px;margin:12px 0;}
  .explain-block h4{margin:0 0 6px;font-size:0.95rem;}
  .formula{
    background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 14px;
    font-family: "Cambria Math", Cambria, Georgia, serif; direction:ltr; text-align:center; margin:8px 0;
  }
  .video-links a{display:block;margin-bottom:6px;font-size:0.9rem;}
  .mistakes-list li{margin-bottom:6px;}

  .progress-bar-outer{background:var(--gray-bg);border-radius:999px;height:8px;overflow:hidden;margin-top:8px;}
  .progress-bar-inner{background:var(--primary);height:100%;}

  .quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:0.85rem;color:var(--text-dim);}
  .quiz-progress-outer{background:var(--gray-bg);border-radius:999px;height:6px;overflow:hidden;margin-bottom:18px;}
  .quiz-progress-inner{background:var(--primary);height:100%;transition:width .2s ease;}

  .question-stem{font-size:1.08rem;margin-bottom:16px;white-space:pre-wrap;}
  .choices{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .choice{
    border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;background:#fff;
    font-size:0.96rem; transition:border-color .12s ease, background-color .12s ease, transform .08s ease;
  }
  .choice:hover{border-color:var(--primary); transform:translateX(-2px);}
  .choice.selected{border-color:var(--primary);background:#eef1fd;}
  .choice.correct{border-color:var(--green);background:var(--green-bg); animation:popIn .25s ease;}
  .choice.incorrect{border-color:var(--red);background:var(--red-bg);}

  .numeric-input-row{display:flex;gap:10px;align-items:center;margin-bottom:14px;}
  .numeric-input-row input{
    flex:1;padding:12px 14px;font-size:1rem;border:1.5px solid var(--border);border-radius:10px;
    font-family:inherit; direction:ltr; text-align:center;
  }
  .numeric-input-row input:focus{outline:none;border-color:var(--primary);}

  .feedback-box{border-radius:10px;padding:12px 14px;margin:10px 0;font-size:0.92rem;font-weight:600;animation:popIn .22s ease;}
  .feedback-correct{background:var(--green-bg);color:var(--green);}
  .feedback-incorrect{background:var(--red-bg);color:var(--red);}
  .feedback-neutral{background:var(--gray-bg);color:var(--text-dim);}

  .hint-box{background:var(--amber-bg);color:#7a5205;border-radius:10px;padding:12px 14px;margin-top:10px;font-size:0.9rem;white-space:pre-wrap;animation:fadeSlideIn .2s ease;}
  .hint-step-label{display:block;font-weight:800;margin-bottom:4px;}
  .hint-final{background:var(--green-bg);color:#155724;}
  .explain-heading{font-weight:700;margin-top:14px;font-size:0.95rem;color:var(--text-dim);}

  .result-topic-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
  .result-topic-row:last-child{border-bottom:none;}
  .tag{font-size:0.75rem;font-weight:700;padding:3px 10px;border-radius:999px;}
  .tag-strong{background:var(--green-bg);color:var(--green);}
  .tag-medium{background:var(--amber-bg);color:var(--amber);}
  .tag-weak{background:var(--red-bg);color:var(--red);}
  .tag-none{background:var(--gray-bg);color:var(--gray);}

  .big-score{font-size:2.6rem;font-weight:800;color:var(--primary);text-align:center;margin:6px 0;}
  .big-score-sub{text-align:center;color:var(--text-dim);margin-bottom:18px;}

  footer.app-footer{margin-top:30px;text-align:center;color:var(--text-dim);font-size:0.8rem;}

  .empty-state{text-align:center;color:var(--text-dim);padding:30px 10px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:#1e2433;color:#fff;padding:10px 20px;border-radius:999px;font-size:0.88rem;
    box-shadow:var(--shadow); z-index:50; opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .toast.show{opacity:1;}

  /* ---- Ask-a-question help widget ---- */
  .ask-fab{
    position:fixed; bottom:22px; left:22px; z-index:70;
    width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--primary), var(--accent-purple));
    color:#fff; font-size:1.5rem; box-shadow:0 4px 16px rgba(52,87,213,0.35);
    display:flex; align-items:center; justify-content:center; transition:transform .15s ease;
  }
  .ask-fab:hover{transform:scale(1.06);}
  .ask-fab-badge{
    position:absolute; top:-2px; right:-2px; background:var(--red); color:#fff;
    border-radius:50%; width:16px; height:16px; font-size:0.6rem; display:flex;
    align-items:center; justify-content:center; border:2px solid #fff;
  }
  .ask-panel-overlay{
    position:fixed; inset:0; background:rgba(20,24,38,0.35); z-index:75;
    display:none; align-items:flex-end; justify-content:flex-start; padding:0;
  }
  .ask-panel-overlay.open{display:flex;}
  .ask-panel{
    background:var(--card-bg); width:100%; max-width:420px; height:min(78vh,640px);
    border-radius:18px 18px 0 0; box-shadow:0 -8px 30px rgba(20,24,38,0.25);
    display:flex; flex-direction:column; animation:fadeSlideIn .2s ease;
    margin:0 0 0 0;
  }
  @media (min-width:480px){
    .ask-panel-overlay{padding:16px;}
    .ask-panel{border-radius:18px; margin-bottom:80px;}
  }
  .ask-panel-header{
    padding:14px 18px; border-bottom:1px solid var(--border); display:flex;
    align-items:center; justify-content:space-between; flex-shrink:0;
  }
  .ask-panel-header h3{margin:0; font-size:1rem;}
  .ask-panel-close{background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--text-dim); line-height:1;}
  .ask-panel-context{
    padding:8px 18px; font-size:0.78rem; color:var(--text-dim); background:var(--gray-bg);
    border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .ask-panel-topic-select{
    padding:8px 18px; font-size:0.78rem; color:var(--text-dim); background:var(--gray-bg);
    border-bottom:1px solid var(--border); flex-shrink:0; display:flex; align-items:center; gap:8px;
  }
  .ask-panel-topic-select select{
    flex:1; padding:6px 8px; border:1px solid var(--border); border-radius:8px; font-family:inherit; font-size:0.8rem; background:#fff;
  }
  .ask-panel-disclaimer{
    padding:8px 18px; font-size:0.72rem; color:var(--amber); background:var(--amber-bg);
    border-bottom:1px solid var(--border); flex-shrink:0; line-height:1.5;
  }
  .ask-panel-messages{flex:1; overflow-y:auto; padding:14px 18px; display:flex; flex-direction:column; gap:10px;}
  .ask-msg{max-width:88%; padding:10px 13px; border-radius:14px; font-size:0.88rem; white-space:pre-wrap; line-height:1.5;}
  .ask-msg-user{align-self:flex-end; background:var(--primary); color:#fff; border-bottom-left-radius:4px;}
  .ask-msg-bot{align-self:flex-start; background:var(--gray-bg); color:var(--text); border-bottom-right-radius:4px;}
  .ask-msg-error{align-self:flex-start; background:var(--red-bg); color:var(--red);}
  .ask-msg-loading{align-self:flex-start; background:var(--gray-bg); color:var(--text-dim); font-style:italic;}
  .ask-panel-footer{padding:12px 18px; border-top:1px solid var(--border); flex-shrink:0; display:flex; gap:8px;}
  .ask-panel-footer textarea{
    flex:1; resize:none; border:1px solid var(--border); border-radius:10px; padding:9px 12px;
    font-family:inherit; font-size:0.88rem; min-height:40px; max-height:90px;
  }
  .ask-panel-footer button{
    background:var(--primary); color:#fff; border:none; border-radius:10px; padding:0 16px;
    font-weight:700; cursor:pointer; font-size:0.85rem;
  }
  .ask-panel-footer button:disabled{opacity:0.5; cursor:default;}
  .ask-not-configured{padding:18px; color:var(--text-dim); font-size:0.88rem; text-align:center;}
  .ask-login{padding:18px;}

  svg.chart{width:100%;height:auto;}

  #app.view-fade{animation:fadeSlideIn .22s ease;}

  .stat-strip{
    display:flex; gap:16px; background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px 18px; margin-bottom:20px; align-items:center; flex-wrap:wrap;
  }
  .stat-ring{position:relative; width:56px;height:56px;flex-shrink:0;}
  .stat-ring svg{width:56px;height:56px;transform:rotate(-90deg);}
  .stat-ring-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:0.78rem; font-weight:800; color:var(--text);
  }
  .stat-strip-text{flex:1;min-width:160px;}
  .stat-strip-text .stat-headline{font-weight:700;font-size:0.98rem;margin-bottom:2px;}
  .stat-strip-text .stat-sub{color:var(--text-dim);font-size:0.84rem;}
  .stat-mini-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:0.78rem;color:var(--text-dim);}
  .stat-mini-legend span{display:inline-flex;align-items:center;gap:4px;}
  .stat-mini-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  /* ---- Persistent top navigation bar (Back / Home) ---- */
  .top-nav-bar{
    position:fixed; top:0; left:0; right:0; z-index:80;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:10px 16px; background:var(--card-bg); border-bottom:1px solid var(--border);
    box-shadow:0 2px 10px rgba(30,36,51,0.06);
  }
  .top-nav-btn{
    display:inline-flex; align-items:center; gap:6px; font-family:inherit;
    background:var(--gray-bg); color:var(--text); border:none; border-radius:999px;
    padding:9px 18px; font-weight:700; font-size:0.85rem; cursor:pointer; transition:background .15s ease;
  }
  .top-nav-btn:hover{background:var(--border);}
  .top-nav-btn:disabled{opacity:0.4; cursor:default; pointer-events:none;}
  .top-nav-home{background:var(--primary); color:#fff;}
  .top-nav-home:hover{background:var(--primary-dark);}
  #app{padding-top:70px;}
  @media (max-width:480px){
    .top-nav-btn{padding:8px 13px; font-size:0.8rem;}
  }
</style>
</head>
<body>
<div class="top-nav-bar" id="topNavBar">
  <button class="top-nav-btn" id="topNavBackBtn" data-action="go-back" disabled>← חזור</button>
  <button class="top-nav-btn top-nav-home" data-action="go-dashboard">🏠 עמוד הבית</button>
</div>
<div id="app"></div>
<input type="file" id="importFileInput" accept=".json" style="display:none;">
<div class="toast" id="toast"></div>

<!-- Ask-a-question help widget: persistent across all views/pages -->
<button class="ask-fab" id="askFab" data-action="toggle-ask-panel" title="שאלה נוספת למורה הדיגיטלי" aria-label="שאלה נוספת">💬</button>
<div class="ask-panel-overlay" id="askPanelOverlay">
  <div class="ask-panel" id="askPanel"></div>
</div>

<script>
(function(){
"use strict";

/* Ask-a-question helper: talks to a small proxy server (not directly to the AI provider),
   so the API key never appears in this public file. Fill in the deployed proxy URL below. */
var HELP_API_URL = "https://talya-ask-proxy.arikko2100.workers.dev/ask";

/* ======================= Storage ======================= */
var STORAGE_KEY = "talya_4_yechidot_v1";

function loadData(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    var parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== "object") return defaultData();
    return Object.assign(defaultData(), parsed);
  }catch(e){
    console.warn("שגיאה בטעינת נתונים שמורים, מתחילים מנתונים ריקים.", e);
    return defaultData();
  }
}

function defaultData(){
  return {
    version: 1,
    topics: {},        // topicId -> {attempts:[{date,score,total}], practiceCount}
    diagnosticRuns: [], // {date, overallScore, perTopic:{topicId:{correct,total}}}
    readinessRuns: []
  };
}

var DATA = loadData();

function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
  }catch(e){
    showToast("שגיאה בשמירת נתונים (אולי אין מקום פנוי בדפדפן)");
    console.error(e);
  }
}

function ensureTopic(topicId){
  if(!DATA.topics[topicId]){
    DATA.topics[topicId] = {attempts: [], practiceCount: 0};
  }
  return DATA.topics[topicId];
}

function recordTopicAttempt(topicId, correct, total, dontKnow){
  var t = ensureTopic(topicId);
  t.attempts.push({date: new Date().toISOString(), correct: correct, total: total, dontKnow: dontKnow||0});
  saveData();
}

function recordPractice(topicId){
  var t = ensureTopic(topicId);
  t.practiceCount = (t.practiceCount||0) + 1;
  saveData();
}

function topicStatus(topicId){
  var t = DATA.topics[topicId];
  if(!t || t.attempts.length === 0) return "not-started";
  var last = t.attempts[t.attempts.length-1];
  var pct = last.total ? (last.correct/last.total) : 0;
  if(pct >= 0.8) return "mastered";
  return "in-progress";
}

function topicLastScoreLabel(topicId){
  var t = DATA.topics[topicId];
  if(!t || t.attempts.length === 0) return null;
  var last = t.attempts[t.attempts.length-1];
  return Math.round((last.correct/last.total)*100) + "%";
}

function exportData(){
  var blob = new Blob([JSON.stringify(DATA, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = "גיבוי-התקדמות-" + dateStr + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);}, 1000);
  showToast("קובץ הגיבוי הורד בהצלחה");
}

function importDataFromFile(file){
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var parsed = JSON.parse(e.target.result);
      if(!parsed || typeof parsed !== "object" || !parsed.topics){
        throw new Error("invalid file");
      }
      DATA = Object.assign(defaultData(), parsed);
      saveData();
      showToast("הנתונים יובאו בהצלחה");
      state.view = "dashboard";
      render();
    }catch(err){
      showToast("הקובץ שנבחר אינו קובץ גיבוי תקין");
      console.error(err);
    }
  };
  reader.readAsText(file);
}

/* ======================= Utilities ======================= */
function randInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
function randNonZero(min, max){ var v; do{ v = randInt(min,max);}while(v===0); return v; }
function pick(arr){ return arr[randInt(0, arr.length-1)]; }
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = randInt(0,i);
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function fmtNum(n){
  if(Math.abs(n - Math.round(n)) < 1e-9) return String(Math.round(n));
  return String(Math.round(n*100)/100);
}
function fmtCoeffTerm(coeff, varPart, isFirst){
  // builds a term like "+3x^2" or "-x" with proper sign spacing for a polynomial string (LTR math)
  if(coeff === 0) return "";
  var sign = coeff < 0 ? " - " : (isFirst ? "" : " + ");
  var abs = Math.abs(coeff);
  var coeffStr = (abs === 1 && varPart) ? "" : fmtNum(abs);
  return sign + coeffStr + varPart;
}
function polyString(terms){
  // terms: array of [coeff, varPart] highest degree first
  var out = "";
  var first = true;
  terms.forEach(function(t){
    if(t[0] === 0) return;
    out += fmtCoeffTerm(t[0], t[1], first);
    first = false;
  });
  if(out === "") out = "0";
  return out.trim();
}
function factorial(n){
  var r = 1;
  for(var i=2;i<=n;i++) r *= i;
  return r;
}
function nCr(n,k){ return Math.round(factorial(n)/(factorial(k)*factorial(n-k))); }
function nPr(n,k){ return Math.round(factorial(n)/factorial(n-k)); }
function checkNumeric(userVal, correct, tolerance){
  if(userVal === null || userVal === undefined || userVal === "") return false;
  var n = parseFloat(String(userVal).replace(",", "."));
  if(isNaN(n)) return false;
  tolerance = tolerance === undefined ? 0.05 : tolerance;
  return Math.abs(n - correct) <= tolerance + Math.abs(correct)*0.01;
}

function showToast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function(){ el.classList.remove("show"); }, 2600);
}

function generateQuestion(topicId){
  var gens = GENERATORS[topicId];
  if(!gens || gens.length===0) return null;
  var fn = pick(gens);
  var q = fn();
  q.key = topicId + "_" + Math.random().toString(36).slice(2,9);
  return q;
}

function buildTopicQuiz(topicId, count){
  var out = [];
  var gens = GENERATORS[topicId] || [];
  if(gens.length===0) return out;
  // try to get variety: cycle through generators, then fill randomly
  var order = shuffle(gens.slice());
  var i=0;
  while(out.length < count){
    var fn = order[i % order.length];
    var q = fn();
    q.key = topicId + "_" + Math.random().toString(36).slice(2,9);
    out.push(q);
    i++;
  }
  return out;
}

function buildDiagnosticQuiz(count){
  var topics = activeTopics();
  var out = [];
  var perTopic = Math.max(1, Math.floor(count/topics.length));
  topics.forEach(function(t){
    for(var i=0;i<perTopic;i++){
      var q = generateQuestion(t.id);
      if(q) out.push(q);
    }
  });
  // top up to reach `count` if rounding left us short
  while(out.length < count){
    var t2 = pick(topics);
    var q2 = generateQuestion(t2.id);
    if(q2) out.push(q2);
    if(out.length > count*3) break; // safety
  }
  return shuffle(out);
}

function recordLastActivity(q, opts){
  // opts: {userAnswerText, wasCorrect, wasDontKnow}
  var t = getTopic(q.topicId);
  var correctAnswerText = q.type === "mc" ? q.choices[q.correctIndex] : fmtNum(q.correctValue);
  state.lastActivity = {
    topicTitle: t ? t.title : "",
    stem: q.stem,
    correctAnswerText: correctAnswerText,
    userAnswerText: opts.wasDontKnow ? "(לא ידע/ה לפתור)" : String(opts.userAnswerText),
    wasCorrect: !!opts.wasCorrect,
    wasDontKnow: !!opts.wasDontKnow,
    fullSolution: q.hints && q.hints.length ? q.hints[q.hints.length-1] : ""
  };
}

  };

function nextPracticeQuestion(){

  q.questions.push(generateQuestion(q.topicId));
  q.index++;
  q.answered=false; q.selected=null; q.revealed=0; q.dontKnow=false; q.dontKnowRevealed=false;

function startQuiz(mode, topicId){
  var questions, count;
  if(mode === "topic-test"){ count = 8; questions = buildTopicQuiz(topicId, count); }
  else if(mode === "diagnostic"){ count = 16; questions = buildDiagnosticQuiz(count); }
  else if(mode === "readiness"){ count = 20; questions = buildDiagnosticQuiz(count); }
  else { questions = []; }

  state.view = "quiz";
  state.currentTopicId = topicId || null;
  state.quiz = {
    mode: mode, topicId: topicId || null,
    questions: questions, index:0,
    answers: [], // {key, topicId, correct, dontKnow}
    answered:false, selected:null, revealed:0, dontKnow:false,
    correctStreak:0, lastPraiseMsg:"", dontKnowRevealed:false
  };
  render();
}

function submitQuizAnswer(isCorrect, q, dontKnow){
  var quiz = state.quiz;
  quiz.answers.push({key:q.key, topicId:q.topicId, correct:isCorrect, dontKnow: !!dontKnow});
  quiz.answered = true;
}

function nextQuizQuestion(){
  var quiz = state.quiz;
  if(quiz.index+1 >= quiz.questions.length){
    finishQuiz();
    return;
  }
  quiz.index++;
  quiz.answered=false; quiz.selected=null; quiz.revealed=0; quiz.dontKnow=false; quiz.dontKnowRevealed=false;
  render();
}

function finishQuiz(){
  var quiz = state.quiz;
  var perTopic = {};
  quiz.answers.forEach(function(a){
    if(!perTopic[a.topicId]) perTopic[a.topicId] = {correct:0,total:0,dontKnow:0};
    perTopic[a.topicId].total++;
    if(a.correct) perTopic[a.topicId].correct++;
    if(a.dontKnow) perTopic[a.topicId].dontKnow++;
  });
  var totalCorrect = quiz.answers.filter(function(a){return a.correct;}).length;
  var totalCount = quiz.answers.length;

  // record per-topic attempts
  Object.keys(perTopic).forEach(function(tid){
    recordTopicAttempt(tid, perTopic[tid].correct, perTopic[tid].total, perTopic[tid].dontKnow);
  });

  var result = {
    mode: quiz.mode,
    date: new Date().toISOString(),
    totalCorrect: totalCorrect, totalCount: totalCount,
    perTopic: perTopic
  };

  if(quiz.mode === "diagnostic"){
    DATA.diagnosticRuns.push({date: result.date, overallScore: totalCorrect/totalCount, perTopic: perTopic});
    saveData();
  } else if(quiz.mode === "readiness"){
    DATA.readinessRuns.push({date: result.date, overallScore: totalCorrect/totalCount, perTopic: perTopic});
    saveData();
  } else if(quiz.mode === "topic-test"){
    saveData();
  }

  state.lastResult = result;
  state.view = "quizResult";
  render();
}

var appEl;

function render(){
  appEl = document.getElementById("app");
  var html = "";
  if(state.view === "dashboard") html = renderDashboard();
  else if(state.view === "topic") html = renderTopicDetail(state.currentTopicId);
  else if(state.view === "practice") html = renderPractice();
  else if(state.view === "quiz") html = renderQuiz();
  else if(state.view === "quizResult") html = renderQuizResult();
  else if(state.view === "progress") html = renderProgress();
  appEl.innerHTML = html;
  appEl.classList.remove("view-fade");
  void appEl.offsetWidth; // force reflow so the animation retriggers on every render
  appEl.classList.add("view-fade");
  window.scrollTo(0,0);
  updateTopNavBar();
}

function esc(s){
  var d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function overallStats(){
  var active = activeTopics();
  var mastered=0, inProgress=0, notStarted=0;
  active.forEach(function(t){
    var s = topicStatus(t.id);
    if(s==="mastered") mastered++; else if(s==="in-progress") inProgress++; else notStarted++;
  });
  var startedCount = mastered+inProgress;
  var pct = active.length ? Math.round((mastered/active.length)*100) : 0;
  return {active: active.length, mastered:mastered, inProgress:inProgress, notStarted:notStarted, pct:pct};
}

function ringSvg(pct, color){
  var r = 22, c = 2*Math.PI*r;
  var offset = c - (pct/100)*c;
  return '<svg viewBox="0 0 56 56">' +
    '<circle cx="28" cy="28" r="' + r + '" fill="none" stroke="var(--gray-bg)" stroke-width="6"/>' +
    '<circle cx="28" cy="28" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="6" stroke-linecap="round" ' +
      'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '"/>' +
    '</svg>';
}

function renderStepByStepExplanation(q){
  // Shows every hint in q.hints as an ordered, labeled step, ending with the full worked solution.
  // Used whenever a student answers incorrectly or chooses "don't know", so they always get
  // a simple, formula-based explanation of *how* to reach the answer — not just the answer itself.
  var out = "";
  for(var i=0; i<q.hints.length; i++){
    var isLast = i === q.hints.length - 1;
    var label = isLast ? "הפתרון המלא:" : ("שלב " + (i+1) + ":");
    out += '<div class="hint-box' + (isLast ? " hint-final" : "") + '"><span class="hint-step-label">' + label + '</span>' + esc(q.hints[i]) + '</div>';
  }
  return out;
}

function renderQuestionCommon(q, quizStateObj, opts){
  // opts: {onSubmit, onNext, showHintButton, footerExtra}
  var body = '<div class="question-stem">' + esc(q.stem) + '</div>';

  if(q.type === "mc"){
    body += '<div class="choices">';
    q.choices.forEach(function(choice, i){
      var cls = "choice";
      if(quizStateObj.answered){
        if(i === q.correctIndex) cls += " correct";
        else if(i === quizStateObj.selected) cls += " incorrect";
      } else if(i === quizStateObj.selected){
        cls += " selected";
      }
      body += '<div class="' + cls + '" data-action="select-choice" data-index="' + i + '">' + esc(choice) + '</div>';
    });
    body += '</div>';
  } else {
    body += '<div class="numeric-input-row">' +
      '<input type="text" inputmode="decimal" id="numericAnswerInput" placeholder="הזן/י תשובה מספרית" ' +
      (quizStateObj.answered ? 'disabled' : '') + ' value="' + (quizStateObj.selected!==null && quizStateObj.selected!==undefined ? esc(String(quizStateObj.selected)) : '') + '">' +
      '</div>';
  }

  if(quizStateObj.answered){
    if(quizStateObj.dontKnow){
      if(!quizStateObj.dontKnowRevealed){
        body += '<div class="feedback-box feedback-neutral">🤔 אין בעיה — לא כל שאלה צריך לדעת.</div>';
        body += '<div class="explain-heading">האם תרצי לראות את שיטת הפתרון והתוצאה?</div>';
        body += '<div class="row" style="margin-top:8px;">' +
          '<button class="btn-primary" data-action="reveal-dontknow-solution">כן</button>' +
          '<button class="btn-ghost" data-action="skip-dontknow-solution">לא</button>' +
          '</div>';
      } else {
        body += '<div class="feedback-box feedback-neutral">🤔 אין בעיה — לא כל שאלה צריך לדעת. ' +
          (q.type==="numeric" ? ("התשובה הנכונה: " + fmtNum(q.correctValue) + ". ") : "") +
          'בואו נראה יחד איך מגיעים לפתרון, צעד אחר צעד:</div>';
        body += renderStepByStepExplanation(q);
        body += '<div class="row" style="margin-top:12px;"><button class="btn-ghost" data-action="toggle-ask-panel">💬 שאלה נוספת על הנושא</button></div>';
      }
    } else {
      var isCorrect = q.type==="mc" ? quizStateObj.selected === q.correctIndex : checkNumeric(quizStateObj.selected, q.correctValue, q.tolerance);
      body += '<div class="feedback-box ' + (isCorrect ? "feedback-correct" : "feedback-incorrect") + '">' +
        (isCorrect ? ("✔ " + esc(quizStateObj.lastPraiseMsg || "נכון!")) : ("✘ לא מדויק. " + (q.type==="numeric" ? ("התשובה הנכונה: " + fmtNum(q.correctValue)) : ""))) +
        '</div>';
      if(isCorrect){
        body += '<div class="hint-box">' + esc(q.hints[q.hints.length-1]) + '</div>';
      } else {
        body += '<div class="explain-heading">💡 בואי נראה יחד איך מגיעים לפתרון הנכון, שלב אחר שלב:</div>';
        body += renderStepByStepExplanation(q);
      }
    }
  } else {
    // hint progression (only outside strict test modes if allowed)
    if(opts.showHintButton){
      for(var h=0; h<quizStateObj.revealed; h++){
        body += '<div class="hint-box">' + esc(q.hints[h]) + '</div>';
      }
      if(quizStateObj.revealed < q.hints.length){
        body += '<div class="row" style="margin-top:8px;"><button class="btn-ghost" data-action="reveal-hint">💡 ' + (quizStateObj.revealed===0? "רמז" : "רמז נוסף") + '</button></div>';
      }
    }
  }

  return body;
}

function topicWeaknessTag(pct, hasData, dontKnowCount, total){
  if(!hasData) return {label:"לא נלמד עדיין", cls:"tag-none"};
  if(dontKnowCount && dontKnowCount === total) return {label:"לא נלמד עדיין", cls:"tag-none"};
  if(pct >= 0.8) return {label:"נושא חזק", cls:"tag-strong"};
  if(pct >= 0.5) return {label:"דורש חיזוק", cls:"tag-medium"};
  return {label:"נושא חלש", cls:"tag-weak"};
}

function buildChartSvg(points, width, height, color){
  if(points.length === 0) return '<div class="empty-state">אין עדיין נתונים להצגה</div>';
  width = width || 600; height = height || 180;
  var pad = 30;
  var maxY = 100, minY = 0;
  var n = points.length;
  var stepX = n>1 ? (width-2*pad)/(n-1) : 0;
  function xAt(i){ return pad + stepX*i; }
  function yAt(v){ return height-pad - ((v-minY)/(maxY-minY))*(height-2*pad); }

  var pathD = points.map(function(p,i){ return (i===0?"M":"L") + xAt(i).toFixed(1) + "," + yAt(p.value).toFixed(1); }).join(" ");
  var circles = points.map(function(p,i){
    return '<circle cx="'+xAt(i).toFixed(1)+'" cy="'+yAt(p.value).toFixed(1)+'" r="4" fill="'+color+'"></circle>' +
      '<title>' + esc(p.label) + ': ' + Math.round(p.value) + '%</title>';
  }).join("");
  var gridLines = [0,25,50,75,100].map(function(v){
    return '<line x1="'+pad+'" y1="'+yAt(v).toFixed(1)+'" x2="'+(width-pad)+'" y2="'+yAt(v).toFixed(1)+'" stroke="#e1e5ee" stroke-width="1"></line>' +
      '<text x="4" y="'+(yAt(v)+4).toFixed(1)+'" font-size="10" fill="#8a93a3">'+v+'%</text>';
  }).join("");

  return '<svg class="chart" viewBox="0 0 ' + width + ' ' + height + '" xmlns="http://www.w3.org/2000/svg">' +
    gridLines +
    '<path d="' + pathD + '" fill="none" stroke="' + color + '" stroke-width="2.5"></path>' +
    circles +
    '</svg>';
}

/* ======================= Event handling ======================= */
document.addEventListener("click", function(e){
  var target = e.target.closest("[data-action]");
  if(!target) return;
  var action = target.getAttribute("data-action");
  var viewBefore = {view: state.view, currentTopicId: state.currentTopicId, lastResult: state.lastResult};

  if(action === "go-dashboard"){ state.view="dashboard"; render(); }
  else if(action === "open-topic"){ state.currentTopicId = target.getAttribute("data-topic"); state.view="topic"; render(); }
  else if(action === "go-topic"){ state.currentTopicId = target.getAttribute("data-topic"); state.view="topic"; render(); }
  else if(action === "start-practice"){ recordPractice(target.getAttribute("data-topic")); startPractice(target.getAttribute("data-topic")); }
  else if(action === "start-topic-test"){ startQuiz("topic-test", target.getAttribute("data-topic")); }
  else if(action === "start-diagnostic"){ startQuiz("diagnostic", null); }
  else if(action === "start-readiness"){ startQuiz("readiness", null); }
  else if(action === "show-progress"){ state.view="progress"; render(); }
  else if(action === "export-data"){ exportData(); }
  else if(action === "import-data"){ document.getElementById("importFileInput").click(); }
  else if(action === "select-choice"){
    var quiz = state.quiz;
    if(quiz.answered) return;
    quiz.selected = parseInt(target.getAttribute("data-index"),10);
    render();
  }
  else if(action === "reveal-hint"){
    var quiz2 = state.quiz;
    quiz2.revealed = Math.min(quiz2.revealed+1, state.quiz.questions[quiz2.index].hints.length);
    render();
  }
  else if(action === "check-answer"){ handleCheckAnswer(); }
  else if(action === "dont-know"){ handleDontKnow(); }
  else if(action === "reveal-dontknow-solution"){ state.quiz.dontKnowRevealed = true; render(); }
  else if(action === "skip-dontknow-solution"){ if(state.view === "practice"){ nextPracticeQuestion(); } else { nextQuizQuestion(); } }
  else if(action === "practice-next"){ nextPracticeQuestion(); }
  else if(action === "quiz-next"){ nextQuizQuestion(); }
  else if(action === "toggle-ask-panel"){ toggleAskPanel(); }
  else if(action === "ask-send"){ sendAskQuestion(); }
  else if(action === "ask-login"){ submitAskLogin(); }
  else if(action === "go-back"){ goBack(); }

  if(action !== "go-back"){
    var navigated = state.view !== viewBefore.view || state.currentTopicId !== viewBefore.currentTopicId;
    if(navigated){
      viewHistory.push(viewBefore);
      if(viewHistory.length > 30) viewHistory.shift();
      updateTopNavBar();
    }
  }
});

document.getElementById("askPanelOverlay").addEventListener("click", function(e){
  if(e.target === e.currentTarget) toggleAskPanel(false);
});

document.addEventListener("input", function(e){
  if(e.target && e.target.id === "numericAnswerInput"){
    var quizObj = state.view === "practice" ? state.quiz : state.quiz;
    quizObj.selected = e.target.value;
  }
  if(e.target && e.target.id === "askQuestionInput"){
    askState.draft = e.target.value;
  }
  if(e.target && e.target.id === "askUsernameInput"){
    askState.loginDraft.username = e.target.value;
  }
  if(e.target && e.target.id === "askPasswordInput"){
    askState.loginDraft.password = e.target.value;
  }
});

document.addEventListener("change", function(e){
  if(e.target && e.target.id === "askTopicSelect"){
    askState.selectedTopicId = e.target.value;
    renderAskPanel();
  }
});

document.addEventListener("keydown", function(e){
  if(e.target && e.target.id === "askQuestionInput" && e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendAskQuestion();
  }
  if(e.target && (e.target.id === "askUsernameInput" || e.target.id === "askPasswordInput") && e.key === "Enter"){
    e.preventDefault();
    submitAskLogin();
  }
});

document.getElementById("importFileInput").addEventListener("change", function(e){
  if(e.target.files && e.target.files[0]){
    importDataFromFile(e.target.files[0]);
  }
  e.target.value = "";
});

function handleCheckAnswer(){
  var quiz = state.quiz;
  var q = quiz.questions[quiz.index];
  if(quiz.answered) return;

  if(q.type === "mc"){
    if(quiz.selected === null || quiz.selected === undefined){ showToast("בחר/י תשובה קודם"); return; }
  } else {
    if(quiz.selected === null || quiz.selected === undefined || quiz.selected === ""){ showToast("הזן/י תשובה קודם"); return; }
  }

  var isCorrect = q.type === "mc" ? quiz.selected === q.correctIndex : checkNumeric(quiz.selected, q.correctValue, q.tolerance);
  quiz.answered = true;

  if(isCorrect){
    quiz.correctStreak = (quiz.correctStreak||0) + 1;
    quiz.lastPraiseMsg = pickPraiseMessage(quiz.correctStreak);
  } else {
    quiz.correctStreak = 0;
  }

  if(state.view === "quiz"){
    submitQuizAnswer(isCorrect, q);
  } else if(state.view === "practice"){
    quiz.total = (quiz.total||0) + 1;
    if(isCorrect) quiz.correctCount = (quiz.correctCount||0) + 1;
  }
  var userAnswerText = q.type === "mc" ? (q.choices[quiz.selected] !== undefined ? q.choices[quiz.selected] : "") : quiz.selected;
  recordLastActivity(q, {userAnswerText: userAnswerText, wasCorrect: isCorrect, wasDontKnow: false});
  render();
}

function handleDontKnow(){
  var quiz = state.quiz;
  var q = quiz.questions[quiz.index];
  if(quiz.answered) return;

  quiz.answered = true;
  quiz.dontKnow = true;
  quiz.correctStreak = 0;

  if(state.view === "quiz"){
    submitQuizAnswer(false, q, true);
  } else if(state.view === "practice"){
    quiz.total = (quiz.total||0) + 1;
  }
  recordLastActivity(q, {wasCorrect:false, wasDontKnow:true});
  render();
}

/* ======================= Ask-a-question helper widget ======================= */
var ASK_AUTH_KEY = "talya_ask_auth_v1";
var askState = {
  open: false,
  loading: false,
  draft: "",
  messages: [],   // {role:'user'|'bot'|'error', text}
  authError: "",
  loginDraft: {username:"", password:""},
  selectedTopicId: "current" // "current" = the topic of the last-answered question (default) | a TOPICS id | "other"
};

function getAskAuth(){
  try{
    var raw = localStorage.getItem(ASK_AUTH_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function setAskAuth(username, password){
  localStorage.setItem(ASK_AUTH_KEY, JSON.stringify({username:username, password:password}));
}
function clearAskAuth(){
  localStorage.removeItem(ASK_AUTH_KEY);
}

function activityContextSummary(){
  var mode = askState.selectedTopicId || "current";
  if(mode === "other"){
    return "בחרת 'נושא אחר' — מה תרצי לברר?";
  }
  if(mode !== "current"){
    var t = getTopic(mode);
    return "השאלה תתייחס לנושא שבחרת: \"" + (t ? t.title : "") + "\".";
  }
  var a = state.lastActivity;
  if(!a) return "עדיין לא נענתה שאלה בהרצה הזו — אפשר לשאול כל שאלה כללית בנושאי 4 יחידות.";
  var line = "בהקשר לשאלה האחרונה בנושא \"" + a.topicTitle + "\"" + (a.wasDontKnow ? " (סומנה כ'לא ידע/ה לפתור')" : (a.wasCorrect ? " (נענתה נכון)" : " (נענתה לא נכון)")) + ".";
  return line;
}

function buildAskContextPayload(){
  var a = state.lastActivity;
  if(!a) return null;
  return {
    topicTitle: a.topicTitle,
    questionStem: a.stem,
    correctAnswer: a.correctAnswerText,
    studentAnswer: a.userAnswerText,
    wasCorrect: a.wasCorrect,
    wasDontKnow: a.wasDontKnow,
    fullSolutionShown: a.fullSolution
  };
}

function buildTopicSelectOptions(){
  var mode = askState.selectedTopicId || "current";
  var currentLabel = state.lastActivity ? state.lastActivity.topicTitle : "כללי";
  var html = '<option value="current"' + (mode==="current"?' selected':'') + '>🔹 הנושא הנוכחי (' + esc(currentLabel) + ')</option>';
  TOPICS.filter(function(t){ return t.active; }).forEach(function(t){
    html += '<option value="' + t.id + '"' + (mode===t.id?' selected':'') + '>' + esc(t.title) + '</option>';
  });
  html += '<option value="other"' + (mode==="other"?' selected':'') + '>➕ נושא אחר</option>';
  return html;
}

function resolveAskTopicContext(){
  var mode = askState.selectedTopicId || "current";
  if(mode === "current") return buildAskContextPayload();
  if(mode === "other") return { topicTitle: "נושא אחר (לפי בחירת התלמידה)" };
  var t = getTopic(mode);
  return { topicTitle: t ? t.title : "" };
}

function toggleAskPanel(forceState){
  askState.open = (typeof forceState === "boolean") ? forceState : !askState.open;
  renderAskPanel();
  var overlay = document.getElementById("askPanelOverlay");
  if(overlay) overlay.classList.toggle("open", askState.open);
}

function renderAskPanel(){
  var panel = document.getElementById("askPanel");
  if(!panel) return;

  if(!HELP_API_URL){
    panel.innerHTML =
      '<div class="ask-panel-header"><h3>💬 שאלה נוספת</h3><button class="ask-panel-close" data-action="toggle-ask-panel">✕</button></div>' +
      '<div class="ask-not-configured">התכונה הזו עדיין לא הופעלה באתר. (חסר חיבור לשרת עזר). ' +
      'אפשר להמשיך להשתמש ברמזים ובפתרונות המלאים שבתוך התרגול בינתיים.</div>';
    return;
  }

  var auth = getAskAuth();
  if(!auth){
    panel.innerHTML =
      '<div class="ask-panel-header"><h3>💬 שאלה נוספת</h3><button class="ask-panel-close" data-action="toggle-ask-panel">✕</button></div>' +
      '<div class="ask-login">' +
        (askState.authError ? '<div class="feedback-box feedback-incorrect">' + esc(askState.authError) + '</div>' : '') +
        '<p style="color:var(--text-dim); font-size:0.85rem;">כניסה לעוזר הלימוד הדיגיטלי (חד-פעמי, נשמר במכשיר הזה בלבד):</p>' +
        '<input type="text" id="askUsernameInput" placeholder="שם משתמש" value="' + esc(askState.loginDraft.username) + '" style="width:100%;margin-bottom:8px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;font-family:inherit;">' +
        '<input type="password" id="askPasswordInput" placeholder="סיסמה" value="' + esc(askState.loginDraft.password) + '" style="width:100%;margin-bottom:12px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;font-family:inherit;">' +
        '<button class="btn-primary" data-action="ask-login" style="width:100%;">כניסה</button>' +
      '</div>';
    var uEl = document.getElementById("askUsernameInput");
    if(uEl) uEl.focus();
    return;
  }

  var msgsHtml = "";
  if(askState.messages.length === 0){
    msgsHtml = '<div class="ask-msg ask-msg-bot">היי! אני עוזר הלימוד הדיגיטלי. אפשר לשאול אותי כל שאלה על מתמטיקה ברמת 4 יחידות — ' +
      'ואם ענית לא נכון על שאלה ברגעים האחרונים, אני כבר יודע על מה מדובר. במה תרצי עזרה?</div>';
  } else {
    askState.messages.forEach(function(m){
      var cls = m.role === "user" ? "ask-msg-user" : (m.role === "error" ? "ask-msg-error" : "ask-msg-bot");
      msgsHtml += '<div class="ask-msg ' + cls + '">' + esc(m.text) + '</div>';
    });
  }
  if(askState.loading){
    msgsHtml += '<div class="ask-msg ask-msg-loading">חושב/ת על תשובה מדויקת...</div>';
  }

  var textareaPlaceholder = (askState.selectedTopicId === "other") ? "מה תרצי לברר?" : "כתבי כאן את השאלה שלך...";

  panel.innerHTML =
    '<div class="ask-panel-header"><h3>💬 שאלה נוספת</h3><button class="ask-panel-close" data-action="toggle-ask-panel">✕</button></div>' +
    '<div class="ask-panel-topic-select"><label for="askTopicSelect">📚 נושא:</label><select id="askTopicSelect">' + buildTopicSelectOptions() + '</select></div>' +
    '<div class="ask-panel-context">' + esc(activityContextSummary()) + '</div>' +
    '<div class="ask-panel-disclaimer">⚠️ התשובות נוצרות על ידי בינה מלאכותית. המודל מונחה לענות רק כשהוא בטוח ולא להמציא נוסחאות, אך מומלץ לוודא תשובות חשובות מול המורה או הפתרון הרשמי.</div>' +
    '<div class="ask-panel-messages" id="askMessagesEl">' + msgsHtml + '</div>' +
    '<div class="ask-panel-footer">' +
      '<textarea id="askQuestionInput" placeholder="' + textareaPlaceholder + '" ' + (askState.loading ? "disabled" : "") + '>' + esc(askState.draft) + '</textarea>' +
      '<button data-action="ask-send" ' + (askState.loading ? "disabled" : "") + '>שלח/י</button>' +
    '</div>';

  var msgsEl = document.getElementById("askMessagesEl");
  if(msgsEl) msgsEl.scrollTop = msgsEl.scrollHeight;
  var inputEl = document.getElementById("askQuestionInput");
  if(inputEl) inputEl.focus();
}

function submitAskLogin(){
  var uEl = document.getElementById("askUsernameInput");
  var pEl = document.getElementById("askPasswordInput");
  var username = uEl ? uEl.value.trim() : "";
  var password = pEl ? pEl.value : "";
  if(!username || !password){
    askState.authError = "יש להזין שם משתמש וסיסמה.";
    renderAskPanel();
    return;
  }
  askState.authError = "";
  setAskAuth(username, password);
  renderAskPanel();
}

function sendAskQuestion(){
  var inputEl = document.getElementById("askQuestionInput");
  var question = inputEl ? inputEl.value.trim() : "";
  if(!question || askState.loading) return;

  var auth = getAskAuth();
  if(!auth){ renderAskPanel(); return; }

  askState.messages.push({role:"user", text:question});
  askState.draft = "";
  askState.loading = true;
  renderAskPanel();

  var payload = {
    question: question,
    context: resolveAskTopicContext(),
    username: auth.username,
    password: auth.password
  };

  fetch(HELP_API_URL, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(payload)
  }).then(function(res){
    if(res.status === 401){
      clearAskAuth();
      throw new Error("AUTH");
    }
    if(!res.ok) throw new Error("שגיאת שרת (" + res.status + ")");
    return res.json();
  }).then(function(data){
    askState.loading = false;
    if(data && data.answer){
      askState.messages.push({role:"bot", text:data.answer});
    } else {
      askState.messages.push({role:"error", text:"לא התקבלה תשובה תקינה. נסו שוב מאוחר יותר."});
    }
    renderAskPanel();
  }).catch(function(err){
    askState.loading = false;
    if(err.message === "AUTH"){
      askState.authError = "שם משתמש או סיסמה שגויים. נסי שוב.";
      askState.messages.pop(); // remove the question that was rejected
    } else {
      askState.messages.push({role:"error", text:"אירעה שגיאה בחיבור לעוזר הדיגיטלי (" + err.message + "). בדקי חיבור לאינטרנט ונסי שוב."});
    }
    renderAskPanel();
  });
}

/* ======================= Init ======================= */
render();
renderAskPanel();

})();
</script>
